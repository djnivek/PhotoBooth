<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src https://frkckrvsdsiwivdfyjau.supabase.co; img-src 'self' https://frkckrvsdsiwivdfyjau.supabase.co; style-src 'self'; script-src 'self'; base-uri 'none'; form-action 'none'; object-src 'none'">
<title>Vos souvenirs · Colors Party by Estelle</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<main>
  <header>
    <div class="brand"><img src="assets/wordmark.png" width="1448" height="1086" alt="Colors Party"><span>by Estelle</span></div>
    <div class="welcome"><h1>La fête reste avec vous.</h1><p class="intro">Vos photos, vos souvenirs, à garder tout près.</p></div>
  </header>
  <div class="sharing">
    <p id="status" role="status" aria-live="polite">Ouverture de vos souvenirs…</p>
    <div class="actions"><a id="archive" class="button" hidden>Télécharger le tout</a><button id="retry" type="button" hidden>Actualiser les liens</button></div>
    <p id="expiry"></p>
  </div>
  <section id="photos" aria-label="Vos photos"></section>
  <section id="sheet" aria-label="Votre planche imprimable" hidden></section>
  <footer>Un souvenir de l’anniversaire d’Estelle.<br>Ce lien donne accès à votre séance. Partagez le avec les personnes de votre choix.</footer>
</main>
<script type="module" src="gallery.js"></script>
</body>
</html>
