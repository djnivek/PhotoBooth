name: Verify
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  windows-rehearsal:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      AVALONIA_TELEMETRY_OPTOUT: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6.0.0
        with:
          global-json-file: global.json
      - uses: denoland/setup-deno@v2.0.5
        with:
          deno-version: v2.9.2
      - name: Run local-only rehearsal checks
        shell: pwsh
        run: ./scripts/verify.ps1
      - name: Test gallery in Chromium
        shell: pwsh
        run: |
          npm ci --prefix tests/browser
          if ($LASTEXITCODE -ne 0) { throw "Browser dependencies failed" }
          Push-Location tests/browser
          npx playwright-core install chromium
          if ($LASTEXITCODE -ne 0) { throw "Chromium installation failed" }
          node gallery.cjs
          if ($LASTEXITCODE -ne 0) { throw "Gallery browser checks failed" }
          node viewer.cjs
          if ($LASTEXITCODE -ne 0) { throw "Gallery browser checks failed" }
          Pop-Location
      - name: Package and execute the extracted Windows app
        shell: pwsh
        run: ./scripts/package-windows.ps1 -Version 0.8.1
      - name: Keep package and executable evidence
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: ColorsParty-win-x64
          if-no-files-found: error
          path: |
            artifacts/package/*.zip
            artifacts/package/*.sha256
            artifacts/package/diagnostics/*.json
            artifacts/package/diagnostics/*.png
            artifacts/package/diagnostics/*error.txt
            artifacts/gallery/*.png
            artifacts/gallery/*.json
            artifacts/viewer-0.8.0/*.json
            .impeccable/review/viewer/*.png
            .impeccable/review/offline-original-*.png
